# Edit this file to define how the model is presented and configured.
# The sibling .scaffold.json lists every group, part, and node path you can
# target with the autoAssign rules and nodes block below.

model:
  name: Doron Velta R2
  glb: Doron_Velta_R2.glb

palette:
  Main:               { color: "#4A4A4A" }                                            # primary printed parts
  Accent:             { color: "#C41E1E" }                                            # user-pickable contrast
  Frame:              { color: "#3a3a3a", metalness: 0.7, showInPicker: false }       # 2020/2040 extrusions, MGN9 rails
  Hardware:           { color: "#888888", metalness: 0.9, showInPicker: false }       # fasteners, bearings, steppers, pulleys, hotend metal, PSU case
  Hardware Detail:    { color: "#888888", metalness: 0.9, showInPicker: false, showInTree: false }   # sub-bodies of hardware, absent from the tree
  Black:              { color: "#1e1e1e", showInPicker: false }                       # belts, feet, fans, silicone, carbon tubes
  Bed:                { color: "#A9A9A9", metalness: 0.6, showInPicker: false }       # bed plate
  Electronics:        { color: "#1d3b2a", metalness: 0.5, showInPicker: false }       # PCBs, relay, SSR
  Components:         { color: "#2e2e2e", showInPicker: false, showInTree: false }    # mainboard SMD parts + connectors, absent from the tree
  Glass:              { color: "#ccddee", metalness: 0.1, opacity: 0.15, showInPicker: false }   # clear side/top panels
  Opaque Panels:      { color: "#333333", showInPicker: false }                       # bottom + inner sheet panels

# Patterns are fnmatch globs against a node's leaf name.
# Order matters — first match wins.
autoAssign:
  # ---- Fasteners, inserts, pins ----------------------------------------
  - { match: "M3*",                       category: Hardware }   # M3 screws + threaded inserts
  - { match: "M5*",                       category: Hardware }   # M5 hex nuts
  - { match: "9????A*",                   category: Hardware }   # McMaster part numbers (BHCS, SHCS, flat heads, heat-set inserts)
  - { match: "*_pin*",                    category: Hardware }   # dowel pins, idler pins

  # ---- Linear motion, delta arms, belts -------------------------------
  - { match: "MGN9H_-_Carriage*",         category: "Hardware Detail" }   # carriage block sub-bodies
  - { match: "MGN9_Carriage*",            category: Hardware }
  - { match: "MGN9*",                     category: Frame }      # rail assembly + rail
  - { match: "Ball_Screw*",               category: Hardware }
  - { match: "Spherical_Bearing_Tie_Rod_End*", category: Hardware }   # rod ends incl. housing, bearing, spacer hardware
  - { match: "210mm_Tie_Rod*",            category: Black }      # carbon tube
  - { match: "Belt_9mm*",                 category: Black }
  - { match: "GT2_*",                     category: Hardware }   # pulleys + idlers
  - { match: "17HS19*",                   category: Hardware }   # NEMA17 steppers
  - { match: "Foot_Plate*",               category: Main }
  - { match: "Foot*",                     category: Black }      # rubber feet

  # ---- Frame ----------------------------------------------------------
  - { match: "HFSB5-*",                   category: Frame }

  # ---- Endstop microswitches -----------------------------------------
  - { match: "D2F_ACTUATOR*",             category: "Hardware Detail" }
  - { match: "D2F_BASE*",                 category: "Hardware Detail" }
  - { match: "Contacts*",                 category: "Hardware Detail" }
  - { match: "Lever*",                    category: "Hardware Detail" }
  - { match: "Plunger*",                  category: "Hardware Detail" }
  - { match: "Switch_Body*",              category: "Hardware Detail" }
  - { match: "D2F*",                      category: Hardware }

  # ---- Bed ------------------------------------------------------------
  - { match: "Bed",                       category: Bed }
  - { match: "Bed_Heater*",               category: Black }      # silicone heater

  # ---- Toolhead -------------------------------------------------------
  - { match: "Dragon_HF*",                category: Hardware }
  - { match: "Silicone_Sock*",            category: Black }
  - { match: "revostep*",                 category: Hardware }   # Revo Voron hotend assembly
  - { match: "PC4_M10*",                  category: Hardware }   # pneumatic couplings
  - { match: "6020_Fan*",                 category: Black }
  - { match: "3010_Blower_Fan*",          category: Black }
  - { match: "30X30X10_DC_fan*",          category: Black }
  - { match: "JST_*",                     category: Components }
  - { match: "Magnets*",                  category: Hardware }
  - { match: "pcb*",                      category: Electronics }
  - { match: "PCB",                       category: Electronics }   # PSU PCB; must precede the P?? refdes rule

  # ---- Electronics ----------------------------------------------------
  - { match: "BIGTREETECH_MANTA_M5P",     category: Electronics }
  - { match: "Board",                     category: Electronics }   # Manta PCB substrate
  - { match: "SSR*",                      category: Electronics }
  - { match: "Main_Relay_Body*",          category: Electronics }
  - { match: "UHP-200_Mount*",            category: Main }
  - { match: "UHP-200",                   category: Hardware }   # Mean Well PSU case
  - { match: "249C*",                     category: "Hardware Detail" }   # PSU internals
  - { match: "DG28C*",                    category: "Hardware Detail" }
  - { match: "FREE-MODELS*",              category: "Hardware Detail" }
  - { match: "Pico_Mount*",               category: Main }

  # ---- Mainboard reference designators (KiCad-style C1, R12, J5, ...) --
  #      Everything below the Manta board node is a component; hide it
  #      from the tree and paint it dark.
  - { match: "C?",   category: Components }
  - { match: "C??",  category: Components }
  - { match: "R?",   category: Components }
  - { match: "R??",  category: Components }
  - { match: "R???", category: Components }
  - { match: "D?",   category: Components }
  - { match: "D??",  category: Components }
  - { match: "E?",   category: Components }
  - { match: "F?",   category: Components }
  - { match: "H?",   category: Components }
  - { match: "J?",   category: Components }
  - { match: "J??",  category: Components }
  - { match: "K?",   category: Components }
  - { match: "L?",   category: Components }
  - { match: "P?",   category: Components }
  - { match: "P??",  category: Components }
  - { match: "Q?",   category: Components }
  - { match: "U?",   category: Components }
  - { match: "U??",  category: Components }
  - { match: "V?",   category: Components }
  - { match: "Y?",   category: Components }
  - { match: "SW?",  category: Components }
  - { match: "MCU-CARD", category: Components }
  - { match: "SOC_CARD", category: Components }
  - { match: "Pull_up",  category: Components }
  - { match: "USB*",     category: Components }
  - { match: "VUSB",     category: Components }

  # ---- Panels ---------------------------------------------------------
  - { match: "Side_Panels*",              category: Glass }
  - { match: "Top_Panel",                 category: Glass }
  - { match: "Door_Handle*",              category: Main }
  - { match: "Panels",                    category: "Opaque Panels" }   # bottom + inner panels inherit

  # ---- Printed-part fallbacks by top-level group ----------------------
  #      Anything in these subtrees that no rule above claimed is a
  #      printed part.
  - { match: "Corners",                   category: Main }
  - { match: "Corners_Covers",            category: Main }
  - { match: "Skirts",                    category: Main }
  - { match: "Toolhead",                  category: Main }
  - { match: "Extruders",                 category: Main }
  - { match: "SpoolHolder",               category: Main }

